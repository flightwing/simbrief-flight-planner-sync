<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>SimBrief Sync</title></head>
<body>
  <main>
    <h1>SimBrief Sync</h1>
    <form id="identity-form">
      <label for="identity">SimBrief account</label>
      <input id="identity" required autocomplete="username" placeholder="Username or Pilot ID">
      <button type="submit">Load from SimBrief</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="preview" hidden>
      <h2>Latest briefing</h2><dl id="plan-details"></dl>
      <button id="import" type="button">Import into Flight Planner</button>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
